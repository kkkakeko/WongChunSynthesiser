<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>合成大峻峻</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }

        body {
            background-color: #f7f1e3;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #top-bar {
            width: 380px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        #game-title {
            font-size: 24px;
            font-weight: bold;
            color: #d63031;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        #music-btn {
            background: #ab47bc;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
        }

        #score-board {
            font-size: 20px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            width: 380px;
            text-align: left;
        }

        #game-container {
            position: relative;
            width: 380px;
            height: 590px;
            background-color: #ffeaa7;
            border: 4px solid #d63031;
            border-radius: 8px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            overflow: hidden;
        }

        #danger-line {
            position: absolute;
            top: 120px;
            left: 0;
            width: 100%;
            height: 2px;
            border-top: 2px dashed #ff7675;
            z-index: 10;
            pointer-events: none;
        }

        canvas {
            display: block;
        }

        #game-over {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            padding: 20px;
            text-align: center;
        }

        #game-over h1 {
            font-size: 32px;
            margin-bottom: 20px;
            color: #ff7675;
        }

        #game-over.win h1 {
            font-size: 22px;
            line-height: 1.6;
            color: #ffeaa7;
        }

        #restart-btn {
            padding: 10px 20px;
            font-size: 18px;
            background-color: #00b894;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        #restart-btn:hover {
            background-color: #55efc4;
            color: #2d3436;
        }

        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.8);
            color: #fff;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 14px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 999;
        }

        #toast.show {
            opacity: 1;
        }
    </style>
</head>
<body>

    <div id="top-bar">
        <h1 id="game-title">合成大峻峻</h1>
        <button id="music-btn" onclick="toggleMusic()">🔇 音樂關</button>
    </div>
    
    <div id="score-board">得分：<span id="score">0</span></div>

    <div id="game-container">
        <div id="danger-line"></div>
        <div id="game-over">
            <h1 id="game-over-text">峻峻合成失敗！</h1>
            <button id="restart-btn" onclick="restartGame()">再試一次</button>
        </div>
    </div>

    <div id="toast"></div>

    <audio id="bgm" loop preload="auto">
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <script>
        const FRUITS_CONFIG = [
            { radius: 16, score: 2, src: 'pic/p1.jpg' },
            { radius: 22, score: 4, src: 'pic/p2.jpg' },
            { radius: 28, score: 8, src: 'pic/p3.jpg' },
            { radius: 36, score: 16, src: 'pic/p4.jpg' },
            { radius: 44, score: 32, src: 'pic/p5.jpg' },
            { radius: 52, score: 64, src: 'pic/p6.jpg' },
            { radius: 62, score: 128, src: 'pic/p7.jpg' },
            { radius: 72, score: 256, src: 'pic/p8.jpg' },
            { radius: 84, score: 512, src: 'pic/p9.jpg' },
            { radius: 98, score: 1024, src: 'pic/p10.jpg' },
            { radius: 112, score: 2048, src: 'pic/p11.jpg' }
        ];

        let FRUITS = [];
        const { Engine, Render, Runner, Bodies, Composite, Body, Events } = Matter;

        let engine, render, runner;
        let currentFruit = null;
        let canDrop = true;
        let score = 0;
        let isGameOver = false;
        let gameOverTimer = null;
        let isTouching = false;
        let isMusicPlaying = false;

        const container = document.getElementById('game-container');
        const width = 380;
        const height = 590;
        const DANGER_Y = 120;
        const GAME_OVER_DELAY = 2000; // 危险线以上持续 2 秒才结束
        const SPAWN_Y = 50;

        const WIN_TEXT = "恭喜你在沒有援手的情況下，成功自己動手合成出大峻峻。峻峻為你拍手！👏";

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            clearTimeout(toast._timer);
            toast._timer = setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function toggleMusic() {
            const bgm = document.getElementById('bgm');
            const musicBtn = document.getElementById('music-btn');

            if (isMusicPlaying) {
                bgm.pause();
                isMusicPlaying = false;
                musicBtn.innerText = "🔇 音樂關";
                musicBtn.style.background = "#ab47bc";
            } else {
                bgm.play().then(() => {
                    isMusicPlaying = true;
                    musicBtn.innerText = "🔊 音樂開";
                    musicBtn.style.background = "#66bb6a";
                }).catch(() => {
                    showToast("無法播放音樂，請確認 song.mp3 是否存在");
                });
            }
        }

        // 將每張圖片裁剪成完美的正圓形，並統一輸出半徑*2 的方形 PNG
        function loadAndProcessImages(callback) {
            let loadedCount = 0;
            FRUITS = new Array(FRUITS_CONFIG.length);

            FRUITS_CONFIG.forEach((config, index) => {
                const img = new Image();
                // 只在 http/https 下設置 crossOrigin，兼容本地 file:// 雙擊打開
                if (location.protocol.startsWith('http')) {
                    img.crossOrigin = "anonymous";
                }
                img.src = config.src;

                const finalize = (fruit) => {
                    FRUITS[index] = fruit;
                    loadedCount++;
                    if (loadedCount === FRUITS_CONFIG.length && callback) callback();
                };

                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const diameter = config.radius * 2;
                    canvas.width = diameter;
                    canvas.height = diameter;
                    const ctx = canvas.getContext('2d');

                    // 正圆裁剪路径
                    ctx.beginPath();
                    ctx.arc(config.radius, config.radius, config.radius, 0, Math.PI * 2);
                    ctx.clip();

                    // 居中裁切成正方形再缩放
                    let srcX = 0, srcY = 0, srcW = img.width, srcH = img.height;
                    if (img.width > img.height) {
                        srcW = img.height;
                        srcX = (img.width - img.height) / 2;
                    } else {
                        srcH = img.width;
                        srcY = (img.height - img.width) / 2;
                    }

                    ctx.drawImage(img, srcX, srcY, srcW, srcH, 0, 0, diameter, diameter);

                    let dataUrl;
                    try {
                        dataUrl = canvas.toDataURL('image/png');
                    } catch (e) {
                        // toDataURL 失败时，用纯色圆兜底
                        ctx.restore();
                        ctx.clearRect(0, 0, diameter, diameter);
                        ctx.fillStyle = '#ff7675';
                        ctx.beginPath();
                        ctx.arc(config.radius, config.radius, config.radius, 0, Math.PI * 2);
                        ctx.fill();
                        dataUrl = canvas.toDataURL();
                    }

                    finalize({
                        radius: config.radius,
                        score: config.score,
                        src: dataUrl,
                        scale: 1
                    });
                };

                img.onerror = () => {
                    // 图片加载失败：纯色圆兜底
                    const canvas = document.createElement('canvas');
                    const diameter = config.radius * 2;
                    canvas.width = diameter;
                    canvas.height = diameter;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ff7675';
                    ctx.beginPath();
                    ctx.arc(config.radius, config.radius, config.radius, 0, Math.PI * 2);
                    ctx.fill();

                    finalize({
                        radius: config.radius,
                        score: config.score,
                        src: canvas.toDataURL(),
                        scale: 1
                    });
                };
            });
        }

        function init() {
            score = 0;
            isGameOver = false;
            canDrop = true;
            isTouching = false;
            currentFruit = null;
            if (gameOverTimer) clearTimeout(gameOverTimer);
            gameOverTimer = null;

            document.getElementById('score').innerText = score;
            const gameOverEl = document.getElementById('game-over');
            gameOverEl.style.display = 'none';
            gameOverEl.classList.remove('win');
            document.getElementById('game-over-text').innerText = '失敗！峻峻很傷心！';

            // 清除旧 canvas
            container.querySelectorAll('canvas').forEach(c => c.remove());

            // 如果之前有 engine，先解绑事件并停止
            if (engine) {
                Events.off(engine);
                if (render) Render.stop(render);
                if (runner) Runner.stop(runner);
                Engine.clear(engine);
            }

            engine = Engine.create({ constraintIterations: 3 });

            render = Render.create({
                element: container,
                engine: engine,
                options: {
                    width: width,
                    height: height,
                    wireframes: false,
                    background: '#ffeaa7'
                }
            });

            Render.run(render);
            runner = Runner.create();
            Runner.run(runner, engine);

            const wallOptions = { isStatic: true, render: { fillStyle: '#d63031' } };
            const ground = Bodies.rectangle(width / 2, height + 20, width, 50, wallOptions);
            const leftWall = Bodies.rectangle(-20, height / 2, 50, height * 2, wallOptions);
            const rightWall = Bodies.rectangle(width + 20, height / 2, 50, height * 2, wallOptions);

            Composite.add(engine.world, [ground, leftWall, rightWall]);

            spawnFruit();

            Events.on(engine, 'collisionStart', handleCollision);
            Events.on(engine, 'afterUpdate', checkGameOver);
        }

        function spawnFruit() {
            if (isGameOver || FRUITS.length === 0) return;

            const randomIndex = Math.floor(Math.random() * 4);
            const fruitData = FRUITS[randomIndex];
            if (!fruitData) return;

            currentFruit = Bodies.circle(width / 2, SPAWN_Y, fruitData.radius, {
                isStatic: true,
                isSensor: true,
                render: {
                    sprite: {
                        texture: fruitData.src,
                        xScale: fruitData.scale,
                        yScale: fruitData.scale
                    }
                },
                plugin: { level: randomIndex }
            });

            Composite.add(engine.world, currentFruit);
            canDrop = true;
        }

        function moveFruit(e) {
            if (!currentFruit) return;
            const rect = container.getBoundingClientRect();
            let x = e.clientX - rect.left;

            const radius = FRUITS[currentFruit.plugin.level].radius;
            x = Math.max(radius, Math.min(width - radius, x));

            Body.setPosition(currentFruit, { x: x, y: SPAWN_Y });
        }

        function dropFruit() {
            if (!isTouching || !canDrop || !currentFruit || isGameOver) return;
            isTouching = false;
            canDrop = false;

            const dropped = currentFruit;
            currentFruit = null;

            dropped.isSensor = false;
            Body.setStatic(dropped, false);
            // 给一个极小的向下速度，避免卡在顶部
            Body.setVelocity(dropped, { x: 0, y: 1 });

            setTimeout(() => {
                spawnFruit();
            }, 700);
        }

        container.addEventListener('pointerdown', (e) => {
            if (!canDrop || !currentFruit || isGameOver) return;
            isTouching = true;
            container.setPointerCapture && container.setPointerCapture(e.pointerId);
            moveFruit(e);
        });

        container.addEventListener('pointermove', (e) => {
            if (!isTouching || !canDrop || !currentFruit || isGameOver) return;
            moveFruit(e);
        });

        container.addEventListener('pointerup', (e) => {
            dropFruit();
        });

        container.addEventListener('pointercancel', (e) => {
            dropFruit();
        });

        // 防止指针离开容器后卡住
        container.addEventListener('pointerleave', (e) => {
            if (isTouching && canDrop && currentFruit && !isGameOver) {
                dropFruit();
            }
        });

        function handleCollision(event) {
            const pairs = event.pairs;
            const merged = new Set();

            pairs.forEach(pair => {
                const { bodyA, bodyB } = pair;

                if (merged.has(bodyA.id) || merged.has(bodyB.id)) return;

                if (
                    bodyA.plugin && bodyB.plugin &&
                    bodyA.plugin.level !== undefined &&
                    bodyA.plugin.level === bodyB.plugin.level
                ) {
                    const currentLevel = bodyA.plugin.level;

                    // 已合成到最高级：直接触发胜利，不再合并
                    if (currentLevel >= FRUITS.length - 1) {
                        merged.add(bodyA.id);
                        merged.add(bodyB.id);
                        triggerWin();
                        return;
                    }

                    merged.add(bodyA.id);
                    merged.add(bodyB.id);

                    Composite.remove(engine.world, [bodyA, bodyB]);

                    const newX = (bodyA.position.x + bodyB.position.x) / 2;
                    const newY = (bodyA.position.y + bodyB.position.y) / 2;
                    const nextLevel = currentLevel + 1;
                    const nextFruitData = FRUITS[nextLevel];

                    score += nextFruitData.score;
                    document.getElementById('score').innerText = score;

                    const newFruit = Bodies.circle(newX, newY, nextFruitData.radius, {
                        render: {
                            sprite: {
                                texture: nextFruitData.src,
                                xScale: nextFruitData.scale,
                                yScale: nextFruitData.scale
                            }
                        },
                        plugin: { level: nextLevel },
                        restitution: 0.2
                    });

                    // 给一点微小速度，让它自然下沉，避免合成后卡住
                    Body.setVelocity(newFruit, {
                        x: (bodyA.velocity.x + bodyB.velocity.x) * 0.5,
                        y: (bodyA.velocity.y + bodyB.velocity.y) * 0.5 + 0.5
                    });

                    Composite.add(engine.world, newFruit);

                    // 如果这次合成的正是最高级，直接胜利
                    if (nextLevel >= FRUITS.length - 1) {
                        triggerWin();
                    }
                }
            });
        }

        function checkGameOver() {
            if (isGameOver) return;

            const bodies = Composite.allBodies(engine.world);
            let isOverLine = false;

            for (let body of bodies) {
                if (body.isStatic || body.isSensor) continue;

                // 用总速度判断是否「真正静止」，阈值放宽到 1.0
                const speed = Math.hypot(body.velocity.x, body.velocity.y);
                if (body.bounds.min.y < DANGER_Y && speed < 1.0) {
                    isOverLine = true;
                    break;
                }
            }

            if (isOverLine) {
                if (!gameOverTimer) {
                    gameOverTimer = setTimeout(() => {
                        triggerGameOver();
                    }, GAME_OVER_DELAY);
                }
            } else {
                if (gameOverTimer) {
                    clearTimeout(gameOverTimer);
                    gameOverTimer = null;
                }
            }
        }

        function triggerGameOver() {
            if (isGameOver) return;
            isGameOver = true;
            if (gameOverTimer) clearTimeout(gameOverTimer);
            gameOverTimer = null;

            const gameOverEl = document.getElementById('game-over');
            gameOverEl.classList.remove('win');
            document.getElementById('game-over-text').innerText = '峻峻合成失敗！';
            gameOverEl.style.display = 'flex';
        }

        function triggerWin() {
            if (isGameOver) return;
            isGameOver = true;
            if (gameOverTimer) clearTimeout(gameOverTimer);
            gameOverTimer = null;

            const gameOverEl = document.getElementById('game-over');
            gameOverEl.classList.add('win');
            document.getElementById('game-over-text').innerText = WIN_TEXT;
            gameOverEl.style.display = 'flex';
        }

        function restartGame() {
            if (gameOverTimer) clearTimeout(gameOverTimer);
            gameOverTimer = null;
            if (engine) {
                Events.off(engine);
                if (render) Render.stop(render);
                if (runner) Runner.stop(runner);
                Engine.clear(engine);
            }
            init();
        }

        // 启动：先处理图片，再进入游戏
        loadAndProcessImages(() => {
            init();
        });
    </script>
</body>
</html>
